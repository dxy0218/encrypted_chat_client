name: Build desktop clients

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows client
            os: windows-latest
            artifact: encrypted-chat-windows-x64
            platform_tag: windows-x64
          - name: Linux client
            os: ubuntu-latest
            artifact: encrypted-chat-linux-x64
            platform_tag: linux-x64
          - name: macOS client
            os: macos-latest
            artifact: encrypted-chat-macos-arm64
            platform_tag: macos-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux GUI runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Run tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests
          python -m compileall encrypted_chat tests build_windows_installer.py

      - name: Build executables
        run: python scripts/build_desktop_clients.py --platform-tag ${{ matrix.platform_tag }} --skip-deps

      - name: Upload client artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/${{ matrix.platform_tag }}/*
